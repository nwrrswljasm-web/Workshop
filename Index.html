<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استمارة التسجيل | Veritasium</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#8b0000 0%,#500000 30%,#160000 65%,#050505 100%);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 15px;
}

.container{
  width:100%;
  max-width:620px;
}

.card{
  background:#fff;
  border:3px solid #d4af37;
  border-radius:24px;
  padding:35px 28px;
  box-shadow:
    0 0 0 2px #8b0000,
    0 20px 60px rgba(0,0,0,.65);
}

.logo{
  display:block;
  width:105px;
  height:105px;
  object-fit:contain;
  margin:0 auto 18px;
}

.brand{
  text-align:center;
  margin-bottom:32px;
}

.brand h1{
  margin:0;
  font-size:27px;
  color:#8b0000;
  font-weight:800;
}

.brand p{
  margin:10px 0 0;
  color:#555;
  font-size:14px;
}

.question{
  margin-bottom:24px;
}

label.title{
  display:block;
  margin-bottom:9px;
  font-size:16px;
  font-weight:bold;
  color:#7a0000;
}

.required{
  color:#b8860b;
}

input[type="text"],
input[type="number"]{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:2px solid #ddd;
  background:#fff;
  color:#222;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#d4af37;
  box-shadow:0 0 0 3px rgba(212,175,55,.18);
}

.option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  margin-bottom:9px;
  border-radius:11px;
  background:#fff;
  border:2px solid #eee;
  color:#333;
  cursor:pointer;
}

.option:hover{
  border-color:#d4af37;
  background:#fffaf0;
}

.option input{
  accent-color:#8b0000;
  width:17px;
  height:17px;
}

button{
  width:100%;
  padding:16px;
  margin-top:8px;
  border:2px solid #d4af37;
  border-radius:12px;
  background:linear-gradient(135deg,#8b0000,#c00000);
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:linear-gradient(135deg,#a00000,#d00000);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.success{
  display:none;
  text-align:center;
  padding:35px 10px 15px;
}

.success h2{
  color:#8b0000;
}

.success p{
  color:#444;
  line-height:1.8;
}

.footer{
  text-align:center;
  margin-top:30px;
  color:#777;
  font-size:12px;
  line-height:1.8;
}

.footer strong{
  color:#8b0000;
  font-size:15px;
}

@media(max-width:500px){
  .card{
    padding:28px 20px;
  }

  .brand h1{
    font-size:23px;
  }
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<img src="logo.png" class="logo" alt="Veritasium">

<div class="brand">
<h1>استمارة التسجيل في ورشة Veritasium</h1>
<p>يرجى تعبئة المعلومات التالية بدقة</p>
</div>


<form
  action="https://formsubmit.co/nwrrswljasm@gmail.com"
  method="POST"
  id="registrationForm"
>

<!-- إعدادات البريد -->

<input type="hidden" name="_subject"
value="تسجيل جديد في ورشة Veritasium">

<input type="hidden" name="_template"
value="table">

<input type="hidden" name="_captcha"
value="true">

<input type="hidden" name="_next"
value="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/success.html">


<!-- الاسم -->

<div class="question">

<label class="title">
الاسم الثلاثي
<span class="required">*</span>
</label>

<input
type="text"
name="الاسم الثلاثي"
placeholder="اكتب اسمك الثلاثي"
required>

</div>


<!-- Telegram -->

<div class="question">

<label class="title">
معرّف Telegram
<span class="required">*</span>
</label>

<input
type="text"
name="معرّف Telegram"
placeholder="@username"
required>

</div>


<!-- العمر -->

<div class="question">

<label class="title">
العمر
<span class="required">*</span>
</label>

<input
type="number"
name="العمر"
min="1"
max="100"
placeholder="اكتب عمرك"
required>

</div>


<!-- حضور سابق -->

<div class="question">

<label class="title">
هل سبق لك حضور إحدى ورش Veritasium؟
</label>

<label class="option">
<input
type="radio"
name="حضور سابق"
value="نعم"
required>
نعم
</label>

<label class="option">
<input
type="radio"
name="حضور سابق"
value="لا">
لا
</label>

</div>


<!-- مصدر معرفة الورشة -->

<div class="question">

<label class="title">
كيف عرفت عن الورشة؟
</label>

<label class="option">
<input
type="radio"
name="مصدر معرفة الورشة"
value="قناة Veritasium"
required>
قناة Veritasium
</label>

<label class="option">
<input
type="radio"
name="مصدر معرفة الورشة"
value="Telegram">
Telegram
</label>

<label class="option">
<input
type="radio"
name="مصدر معرفة الورشة"
value="Instagram">
Instagram
</label>

<label class="option">
<input
type="radio"
name="مصدر معرفة الورشة"
value="عن طريق صديق/معارف">
عن طريق صديق/معارف
</label>

<label class="option">
<input
type="radio"
name="مصدر معرفة الورشة"
value="أخرى">
أخرى
</label>

</div>


<button type="submit">
تسجيل المشاركة
</button>

</form>


<div class="success" id="success">

<h2>تم التسجيل بنجاح ✓</h2>

<p>
شكرًا لتسجيلكم، نتطلع إلى مشاركتكم في الورشة.
</p>

</div>


<div class="footer">

<strong>Veritasium</strong><br>
Via the Truth<br>
EST. 2026

</div>

</div>

</div>

</body>
</html>
