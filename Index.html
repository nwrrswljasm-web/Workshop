<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veritasium | Workshop Registration</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, Tahoma, sans-serif;
}
body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(
            circle at top,
            #a00000 0%,
            #650000 30%,
            #260000 60%,
            #050505 100%
        );
    color: #fff;
}
.container {
    width: 100%;
    max-width: 620px;
}
.card {
    background: #ffffff;
    border: 3px solid #d4af37;
    border-radius: 24px;
    padding: 32px 27px;
    box-shadow:
        0 0 0 2px #800000,
        0 20px 60px rgba(0,0,0,.65);
}
.logo {
    display: block;
    width: 105px;
    height: 105px;
    object-fit: contain;
    margin: 0 auto 18px;
}
.header {
    text-align: center;
    margin-bottom: 30px;
}
.header h1 {
    margin: 0;
    color: #8b0000;
    font-size: 26px;
    font-weight: 800;
}
.header p {
    margin-top: 10px;
    color: #666;
    font-size: 14px;
}
.question {
    margin-bottom: 23px;
}
.title {
    display: block;
    margin-bottom: 9px;
    color: #720000;
    font-size: 16px;
    font-weight: bold;
}
.required {
    color: #c49b20;
}
input[type="text"],
input[type="number"] {
    width: 100%;
    padding: 15px;
    background: #fff;
    color: #222;
    border: 2px solid #ddd;
    border-radius: 11px;
    outline: none;
    font-size: 15px;
    transition: .2s;
}
input[type="text"]:focus,
input[type="number"]:focus {
    border-color: #d4af37;
    box-shadow:
        0 0 0 3px rgba(212,175,55,.18);
}
.option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    color: #333;
    background: #fff;
    border: 2px solid #eeeeee;
    border-radius: 11px;
    cursor: pointer;
    transition: .2s;
}
.option:hover {
    border-color: #d4af37;
    background: #fffaf0;
}
.option input {
    width: 17px;
    height: 17px;
    accent-color: #8b0000;
}
button {
    width: 100%;
    padding: 16px;
    margin-top: 5px;
    border: 2px solid #d4af37;
    border-radius: 12px;
    background:
        linear-gradient(
            135deg,
            #7d0000,
            #c00000
        );
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    box-shadow:
        0 6px 18px rgba(139,0,0,.25);
}
button:hover {
    transform: translateY(-2px);
    background:
        linear-gradient(
            135deg,
            #9b0000,
            #d00000
        );
}
.footer {
    margin-top: 28px;
    text-align: center;
    color: #777;
    font-size: 12px;
    line-height: 1.8;
}
.footer strong {
    color: #8b0000;
    font-size: 15px;
}
@media(max-width:500px) {
    body {
        padding: 12px;
    }
    .card {
        padding: 27px 19px;
    }
    .header h1 {
        font-size: 22px;
    }
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<!-- شعار Veritasium -->
<img
    src="logo.png"
    alt="Veritasium"
    class="logo"
>
<!-- العنوان -->
<div class="header">
<h1>
استمارة التسجيل في ورشة Veritasium
</h1>
<p>
يرجى تعبئة المعلومات التالية بدقة
</p>
</div>
<!-- الاستمارة -->
<form
    action="https://formsubmit.co/nwrrswljasm@gmail.com"
    method="POST"
>
<!-- إعدادات البريد -->
<input
    type="hidden"
    name="_subject"
    value="تسجيل جديد في ورشة Veritasium"
>
<input
    type="hidden"
    name="_template"
    value="table"
>
<input
    type="hidden"
    name="_captcha"
    value="true"
>
<!-- الاسم الثلاثي -->
<div class="question">
<label class="title">
الاسم الثلاثي
<span class="required">*</span>
</label>
<input
    type="text"
    name="الاسم الثلاثي"
    placeholder="اكتب اسمك الثلاثي"
    required
>
</div>
<!-- Telegram -->
<div class="question">
<label class="title">
معرّف Telegram
<span class="required">*</span>
</label>
<input
    type="text"
    name="معرّف Telegram"
    placeholder="@username"
    required
>
</div>
<!-- العمر -->
<div class="question">
<label class="title">
العمر
<span class="required">*</span>
</label>
<input
    type="number"
    name="العمر"
    placeholder="اكتب عمرك"
    min="1"
    max="100"
    required
>
</div>
<!-- حضور سابق -->
<div class="question">
<label class="title">
هل سبق لك حضور إحدى ورش Veritasium؟
</label>
<label class="option">
<input
    type="radio"
    name="حضور سابق"
    value="نعم"
    required
>
نعم
</label>
<label class="option">
<input
    type="radio"
    name="حضور سابق"
    value="لا"
>
لا
</label>
</div>
<!-- مصدر معرفة الورشة -->
<div class="question">
<label class="title">
كيف عرفت عن الورشة؟
</label>
<label class="option">
<input
    type="radio"
    name="كيف عرفت عن الورشة"
    value="قناة Veritasium"
    required
>
قناة Veritasium
</label>
<label class="option">
<input
    type="radio"
    name="كيف عرفت عن الورشة"
    value="Telegram"
>
Telegram
</label>
<label class="option">
<input
    type="radio"
    name="كيف عرفت عن الورشة"
    value="عن طريق صديق/معارف"
>
عن طريق صديق/معارف
</label>
<label class="option">
<input
    type="radio"
    name="كيف عرفت عن الورشة"
    value="أخرى"
>
أخرى
</label>
</div>
<!-- زر التسجيل -->
<button type="submit">
تسجيل المشاركة
</button>
</form>
<!-- التذييل -->
<div class="footer">
<strong>Veritasium</strong>
<br>
Via the Truth
<br>
EST. 2026
</div>
</div>
</div>
</body>
</html>
